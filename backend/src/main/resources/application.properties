spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/subculture?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# CORS: 쉼표로 구분. 전체 허용은 CORS_ALLOWED_ORIGINS=*
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,https://*.vercel.app}
