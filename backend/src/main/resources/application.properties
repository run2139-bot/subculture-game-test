spring.application.name=backend
server.port=${PORT:8080}

# Aiven MySQL (SSL 필수). 비밀번호는 반드시 환경변수 DB_PASSWORD 로만 전달한다.
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-2a187ce8-run2139-3c1c.a.aivencloud.com}:${DB_PORT:15306}/${DB_NAME:defaultdb}?useSSL=true&verifyServerCertificate=false&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# CORS: 쉼표로 구분. 전체 허용은 CORS_ALLOWED_ORIGINS=*
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,https://*.vercel.app}
